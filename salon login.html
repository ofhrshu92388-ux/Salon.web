<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarberStudio — Login</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#01040a;color:#e9e1d8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:360px;border:1px solid rgba(223,177,91,.25);border-radius:18px;background:#030812;padding:26px 20px;text-align:center}
h1{margin:0 0 6px;font-size:28px;color:#f7e6b0}
.sub{margin:0 0 18px;font-size:13px;color:#b9ada1;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:40px;border:1px solid #dfb15b;background:none;color:#dfb15b;font-size:14px;cursor:pointer}
.tab.on{background:#dfb15b;color:#1a0f0a;font-weight:600}
input{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(223,177,91,.3);background:#050d1c;color:#e9e1d8;font-size:14px}
.btn{width:100%;min-height:46px;border:0;border-radius:40px;background:#dfb15b;color:#1a0f0a;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px}
.btn.alt{background:none;border:1px solid #dfb15b;color:#dfb15b}
.btn:disabled{opacity:.6}
.msg{min-height:20px;margin:10px 0 0;font-size:13px;line-height:1.5}
.msg.err{color:#ff8a80}.msg.ok{color:#9be29b}
.or{margin:12px 0;font-size:12px;color:#b9ada1}
.link{display:inline-block;margin-top:14px;font-size:12px;color:#b9ada1;text-decoration:underline;background:none;border:0;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>BarberStudio</h1>
  <p class="sub" id="sub">Booking ke liye login karo ya naya account banao.</p>

  <div class="tabs">
    <button class="tab on" id="tabLogin">Login</button>
    <button class="tab" id="tabSignup">Sign up</button>
  </div>

  <input type="text" id="name" placeholder="Your name" class="hide">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password (min 6 characters)">
  <button class="btn" id="mainBtn">Login</button>

  <div class="or">ya</div>
  <button class="btn alt" id="googleBtn">Google se continue karo</button>

  <button class="btn alt hide" id="resendBtn" style="margin-top:10px">Verify email dobara bhejo</button>
  <button class="link hide" id="forgotBtn">Password bhool gaye?</button>

  <p class="msg" id="msg"></p>
  <a class="link" href="index.html">Home par jao</a>
</div>

<script>
"use strict";

/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyDJwlPt6yY3eCc7I5UyHV7p-APnICkuCeQ",
  authDomain: "barberstudio-389f0.firebaseapp.com",
  projectId: "barberstudio-389f0",
  storageBucket: "barberstudio-389f0.firebasestorage.app",
  messagingSenderId: "69089290514",
  appId: "1:69089290514:web:ab604123e76c4eb24cabcb",
  measurementId: "G-ZBDB0XWN7K"
});
const auth = firebase.auth();

/* ================= NEXT (wapas kahan jaana hai) ================= */
const BOOKING_URL = "https://ofhrshu92388-ux.github.io/Salon.web/booking.html";
const nextParam = new URLSearchParams(location.search).get("next");
const nextUrl = (nextParam && nextParam.startsWith("https://ofhrshu92388-ux.github.io/"))
  ? nextParam : BOOKING_URL;

function goNext() { location.href = nextUrl; }

/* ================= ELEMENTS ================= */
const $ = id => document.getElementById(id);
const nameEl = $("name"), emailEl = $("email"), passEl = $("password");
const mainBtn = $("mainBtn"), googleBtn = $("googleBtn");
const resendBtn = $("resendBtn"), forgotBtn = $("forgotBtn");
const msg = $("msg");
let mode = "login";

function say(text, ok) {
  msg.textContent = text || "";
  msg.className = "msg " + (ok ? "ok" : "err");
}

function setMode(m) {
  mode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  nameEl.classList.toggle("hide", m !== "signup");
  forgotBtn.classList.toggle("hide", m !== "login");
  mainBtn.textContent = m === "login" ? "Login" : "Account banao";
  resendBtn.classList.add("hide");
  say("");
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");
setMode("login");

function errText(e) {
  const c = e && e.code;
  if (c === "auth/invalid-email") return "Email sahi nahi hai.";
  if (c === "auth/weak-password") return "Password kam se kam 6 characters ka rakho.";
  if (c === "auth/email-already-in-use") return "Ye email pehle se registered hai. Login karo.";
  if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found")
    return "Email ya password galat hai.";
  if (c === "auth/too-many-requests") return "Bahut zyada koshish ho gayi. Thodi der baad try karo.";
  if (c === "auth/popup-closed-by-user") return "Google window band ho gayi.";
  if (c === "auth/unauthorized-domain")
    return "Firebase me ye domain authorized nahi hai (Authentication > Settings > Authorized domains).";
  return (e && e.message) || "Kuch gadbad ho gayi.";
}

/* verify mail me bhi wapsi ka link jaata hai */
function sendVerify(user) {
  return user.sendEmailVerification({ url: nextUrl });
}

/* ================= LOGIN / SIGNUP ================= */
mainBtn.onclick = async () => {
  const email = emailEl.value.trim();
  const pass = passEl.value;
  const name = nameEl.value.trim();

  if (!email || !pass) { say("Email aur password dono daalo."); return; }
  if (mode === "signup" && !name) { say("Apna naam daalo."); return; }

  mainBtn.disabled = true;
  say("");

  try {
    if (mode === "signup") {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await sendVerify(cred.user);
      say("Account ban gaya. " + email + " par verify link bheja hai. Link dabane ke baad yahan Login karo.", true);
      resendBtn.classList.remove("hide");
      setTimeout(() => {}, 0);
    } else {
      const cred = await auth.signInWithEmailAndPassword(email, pass);
      await cred.user.reload();
      if (auth.currentUser.emailVerified) {
        goNext();
      } else {
        say("Pehle apna Gmail verify karo. Mail me aaye link par click karo, phir dobara Login karo.");
        resendBtn.classList.remove("hide");
      }
    }
  } catch (e) {
    say(errText(e));
  } finally {
    mainBtn.disabled = false;
  }
};

/* ================= GOOGLE ================= */
googleBtn.onclick = async () => {
  googleBtn.disabled = true;
  say("");
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    goNext();                          // Google email already verified hota hai
  } catch (e) {
    say(errText(e));
  } finally {
    googleBtn.disabled = false;
  }
};

/* ================= RESEND / FORGOT ================= */
resendBtn.onclick = async () => {
  try {
    if (!auth.currentUser) { say("Pehle Login karo, phir verify mail dobara bhejo."); return; }
    await sendVerify(auth.currentUser);
    say("Verify mail dobara bhej diya.", true);
  } catch (e) { say(errText(e)); }
};

forgotBtn.onclick = async () => {
  const email = emailEl.value.trim();
  if (!email) { say("Pehle email daalo."); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    say("Password reset link " + email + " par bhej diya.", true);
  } catch (e) { say(errText(e)); }
};

/* ================= PEHLE SE LOGIN USER ================= */
auth.onAuthStateChanged(async (user) => {
  if (!user) return;
  try { await user.reload(); } catch (e) {}
  if (auth.currentUser && auth.currentUser.emailVerified) goNext();
});
</script>
</body>
</html>
